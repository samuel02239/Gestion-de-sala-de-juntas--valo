# Envía los avisos push de la Sala de Juntas a los navegadores registrados.
# Corre cada 5 minutos (GitHub puede retrasarlo algunos minutos en horas de alta demanda).
# Requiere el secreto VAPID_PRIVATE_KEY (Settings > Secrets and variables > Actions).
name: Avisos push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: avisos-push
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # solo para mantener activa la programación (ver último paso)

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Enviar avisos pendientes
        run: python scripts/enviar_avisos.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      # GitHub pausa las tareas programadas de repositorios sin actividad por 60 días.
      # Una vez al día se vuelve a habilitar este flujo para que los avisos no se detengan.
      - name: Mantener activa la programación
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "12" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable" && echo "Programación renovada"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
